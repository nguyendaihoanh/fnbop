# ==============================================================================
# Nginx Configuration for Standalone On-Premise (FnBOps Core)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _ localhost 127.0.0.1;
    root /var/www/fnbops;
    index index.html;

    include /etc/nginx/conf.d/security.rules;

    # Redirect deprecated v2.html to PWA root
    location = /v2.html {
        return 301 /;
    }

    # Allow PWA manifest.json explicitly before blocking general .json data files
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Block direct browser access to sensitive data, config, script, and database files
    location ~* \.(json|lock|db|db-wal|db-shm|env|py|pyc|sql|bak|sh|pickle)$ {
        deny all;
        return 404;
    }

    # FastAPI Backend Core API
    location ^~ /api/v1/ {
        proxy_pass http://backend:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Zalo Gateway Microservice API
    location ^~ /api/zalo/ {
        proxy_pass http://zalo-gateway:8177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Zalo Gateway Health Check Proxy
    location = /health/zalo {
        proxy_pass http://zalo-gateway:8177/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block source maps in production
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # Cache control for frontend assets
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # PWA SPA Router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
