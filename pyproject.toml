[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fnbops"
version = "1.0.0"
description = "FnBOps / WFM — F&B Operations & Workforce Management Platform"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "Nguyen Dai Hoanh (VNAIGC)", email = "hoanh@vnaigc.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "filelock>=3.13.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.20",
    "pywebpush>=2.0.0",
    "httpx>=0.27.0",
    "reportlab>=4.2.0",
    "pillow>=13.0.0",
    "certifi>=2026.10.19",
]

[project.scripts]
wfm = "backend.cli:main"
fnbops = "backend.cli:main"
fnbop = "backend.cli:main"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-subtests>=0.14.0",
]
migration = [
    "google-api-python-client>=2.146.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
addopts = "--ignore=tests/test_live_system_readiness.py"

[tool.setuptools.packages.find]
include = ["backend*"]

